# OrbitWorks chatbot — VPS deployment
#
# Designed to sit alongside other projects on a shared VPS:
#   * Ports are high and non-standard (18000/13000) to avoid collisions.
#   * Both services join a private network named for this project only.
#   * Containers restart unless explicitly stopped, so a reboot brings them back.
#
# PORT BINDING
# ------------
# Both services bind to 127.0.0.1 by default: Nginx is the only way in, and the
# server's ufw allows just 22/80/443, so exposing these publicly would be
# blocked anyway. Ports 18000/13000 are used because 8000 and 3000 are already
# taken by another project on this VPS.
#
# To reach a service directly for debugging (not recommended in production):
#   API_BIND=0.0.0.0 docker compose ... up -d
#
# Run from the REPOSITORY ROOT, not from infra/:
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build

name: orbitworks-chatbot

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    image: orbitworks/chatbot-api:latest
    container_name: orbitworks-chatbot-api
    restart: unless-stopped
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-18000}:8000"
    environment:
      # Secrets come from the .env file passed with --env-file; they are never
      # baked into the image.
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_KEY: ${SUPABASE_KEY:?SUPABASE_KEY is required}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?SUPABASE_SERVICE_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      # Deliberately NOT passed when unset: compose would set it to an empty
      # string, and the OpenAI SDK treats an empty base_url as a real value,
      # producing APIConnectionError on every call. The provider also guards
      # against this, but not sending it at all is the cleaner fix.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-20}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    networks:
      - chatbot
    # Force IPv4 resolvers. This host is dual-stack, but Docker's default
    # bridge does not route IPv6 — and Docker's embedded resolver was
    # returning IPv6-only records for api.openai.com, so every OpenAI call
    # failed with APIConnectionError while plain curl (which falls back to
    # IPv4) still worked.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Opt-in: started only with `--profile voice`, so chatbot deploys keep
  # working on a server whose .env has no Deepgram/ElevenLabs/Twilio keys yet.
  # Voice keys are therefore not marked required here; the gateway logs a
  # warning at startup and rejects calls until they are set.
  #   ./infra/dc --profile voice up -d --build voice
  voice:
    profiles: ["voice"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.voice
    image: orbitworks/voice-gateway:latest
    container_name: orbitworks-voice-gateway
    restart: unless-stopped
    ports:
      - "${VOICE_BIND:-127.0.0.1}:${VOICE_PORT:-18001}:8001"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_KEY: ${SUPABASE_KEY:?SUPABASE_KEY is required}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?SUPABASE_SERVICE_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-2-phonecall}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_DEFAULT_VOICE_ID: ${ELEVENLABS_DEFAULT_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_flash_v2_5}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      VOICE_PUBLIC_BASE_URL: ${VOICE_PUBLIC_BASE_URL:-}
      VOICE_VALIDATE_TWILIO_SIGNATURE: ${VOICE_VALIDATE_TWILIO_SIGNATURE:-true}
      VOICE_RECORDING_ENABLED: ${VOICE_RECORDING_ENABLED:-true}
      VOICE_DIAL_API_KEY: ${VOICE_DIAL_API_KEY:-}
      VOICE_CAMPAIGN_RUNNER: ${VOICE_CAMPAIGN_RUNNER:-false}
      VOICE_CAMPAIGN_POLL_S: ${VOICE_CAMPAIGN_POLL_S:-30}
      VOICE_ENDPOINTING_MS: ${VOICE_ENDPOINTING_MS:-400}
      VOICE_DEAD_AIR_TIMEOUT_MS: ${VOICE_DEAD_AIR_TIMEOUT_MS:-2000}
    networks:
      - chatbot
    # Same IPv4-resolver fix as the api service — OpenAI, Deepgram and
    # ElevenLabs are all reached from inside this container.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  admin:
    build:
      context: ..
      dockerfile: infra/Dockerfile.admin
      args:
        # NEXT_PUBLIC_* are compiled into the browser bundle at build time, so
        # they must be build args. Public values only — never the service key.
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_KEY}
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required (e.g. https://chat.orb-itworks.com)}
        NEXT_PUBLIC_WIDGET_URL: ${PUBLIC_WIDGET_URL:?PUBLIC_WIDGET_URL is required (e.g. https://chat.orb-itworks.com/widget.js)}
    image: orbitworks/chatbot-admin:latest
    container_name: orbitworks-chatbot-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-13000}:3000"
    depends_on:
      - api
    networks:
      - chatbot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  chatbot:
    name: orbitworks-chatbot-net
    driver: bridge
