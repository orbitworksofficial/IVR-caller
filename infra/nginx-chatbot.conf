# Nginx site config for the OrbitWorks chatbot.
#
# Install as a NEW file — do not edit the configs of sites already running:
#   sudo cp infra/nginx-chatbot.conf /etc/nginx/sites-available/orbitworks-chatbot
#   sudo ln -s /etc/nginx/sites-available/orbitworks-chatbot /etc/nginx/sites-enabled/
#   sudo nginx -t          # ALWAYS test — a bad config takes down every site on this server
#   sudo systemctl reload nginx
#
# Then add TLS (certbot rewrites these blocks in place, adding listen 443 + certs):
#   sudo certbot --nginx -d chat.orb-itworks.com -d admin.orb-itworks.com
#
# Both upstreams listen on 127.0.0.1 only, so Nginx is the sole way in and no
# firewall change is needed — traffic arrives on 443, which ufw already allows.

# ── API + widget bundle ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name chat.orb-itworks.com;

    # Visitors never upload anything; keep bodies small to limit abuse.
    client_max_body_size 2m;

    access_log /var/log/nginx/orbitworks-chatbot-api.access.log;
    error_log  /var/log/nginx/orbitworks-chatbot-api.error.log;

    # The widget bundle is static and identical for every tenant — let browsers
    # and any CDN cache it. Bump the URL or clear caches after a widget change.
    location = /widget.js {
        proxy_pass http://127.0.0.1:18000/widget.js;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_valid 200 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # SSE streaming endpoint. Buffering MUST be off here or tokens are held
    # back and the whole reply arrives at once, defeating the streaming UI.
    location /chat/stream {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}

# ── Admin dashboard ──────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.orb-itworks.com;

    # Knowledge-base uploads go through here; the API caps files at 10MB.
    client_max_body_size 12m;

    access_log /var/log/nginx/orbitworks-chatbot-admin.access.log;
    error_log  /var/log/nginx/orbitworks-chatbot-admin.error.log;

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev/HMR and websocket upgrades.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
    }
}
